# Nom de l'application
spring.application.name=snack-management-system

# Configuration H2 (base de données en mémoire)
spring.datasource.url=jdbc:h2:mem:snackdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (accessible via navigateur : http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-c

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true 